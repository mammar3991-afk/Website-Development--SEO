<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="t d" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif">
<title id="t">Contact center agent on a call</title>
<desc id="d">Illustration: an agent wearing a headset in front of a contact center dashboard, with an incoming call card, a matched CRM record and an AI call summary. Sample data.</desc>
