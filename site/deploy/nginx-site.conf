# Octavebytes static site: nginx server blocks for a Contabo (or any Linux) VPS.
# Untested against a live server: run `sudo nginx -t` before reloading.
#
# 1. Copy nginx-redirects.conf to /etc/nginx/snippets/octavebytes-redirects.conf
# 2. Put this file in /etc/nginx/sites-available/octavebytes and symlink it into sites-enabled
# 3. Get the certificate:  sudo certbot --nginx -d octavebytes.com -d www.octavebytes.com
#    (certbot may rewrite the ssl_* lines below; that is fine)

server {
    listen 80;
    listen [::]:80;
    server_name octavebytes.com www.octavebytes.com;
    return 301 https://octavebytes.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.octavebytes.com;
    ssl_certificate     /etc/letsencrypt/live/octavebytes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/octavebytes.com/privkey.pem;
    return 301 https://octavebytes.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name octavebytes.com;

    ssl_certificate     /etc/letsencrypt/live/octavebytes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/octavebytes.com/privkey.pem;

    root /var/www/octavebytes/current;
    index index.html;

    # Old WordPress URLs -> new pages (generated from design/05-seo-and-migration-plan.md)
    include /etc/nginx/snippets/octavebytes-redirects.conf;

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never serve dotfiles or build metadata
    location ~ /\. { deny all; }
    location = /BUILD-INFO.txt { deny all; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
